[package]
name = "ahiru-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ahiru"
path = "src/main.rs"

[dependencies]
# `export` / `export-parquet`: COPY (SELECT ...) TO 'x.csv'/'x.jsonl'/'x.parquet'
# is made available from the CLI too. The actual writing to files is done here
# (`main.rs`), not in `ahiru-core` (which is no_std and cannot touch the
# filesystem). Parquet output is opt-in on wasm for size reasons, but the
# native CLI has no size constraint, so it is on by default (also required to
# verify DuckDB interoperability end to end in `tests/copy.rs`).
ahiru-core = { path = "../ahiru-core", features = ["std", "export", "export-parquet"] }
# On wasm, ZSTD is lazily loaded as a separate module, but the native CLI may
# link it directly (the size constraint applies only to the core .wasm).
# Doing so also lets the CLI exercise the codec delegation protocol end to end.
ahiru-zstd = { path = "../ahiru-zstd", features = ["std"] }
