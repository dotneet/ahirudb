[package]
name = "ahiru-zstd"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Do not give this crate `cdylib` by default. Cargo builds every crate-type
# listed in `[lib]` even for dependency crates, so when `ahiru-core` only
# means to link this as a library (as an `rlib`), Cargo would also try to
# build the `cdylib` (a standalone wasm module link), which fails to link
# without an allocator / panic handler of its own (see the `standalone`
# feature). When building it as a standalone wasm module, `scripts/size.sh`
# overrides this explicitly with `cargo rustc --crate-type cdylib`.
#
crate-type = ["rlib"]

[features]
# std is enabled only for native development and testing.
# wasm distribution uses --no-default-features, leaving no_std.
default = ["std"]
std = []
# Leave this off when `ahiru-core` links this crate as a library (the default
# distribution path, DESIGN.md §6). The global allocator, the panic handler,
# and the wasm ABI entry points (the `abi` module) all assume this crate is
# the top level of a standalone wasm module, and `ahiru-core` defines the same
# items, so linking both yields duplicate-definition link errors. Enable this
# only on the standalone-build side, when you want to drop the `zstd` feature
# to decouple from `ahiru-core` and ship the older shape where the host loads
# this module separately (see `scripts/size.sh`).
standalone = []

[dependencies]
# Zero dependencies. Keep the side module even smaller than the core (DESIGN.md §6).

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
