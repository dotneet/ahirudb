[package]
name = "ahiru-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# std is enabled only for native development and testing.
# wasm builds use --no-default-features, leaving no_std + Parquet only.
default = ["std", "csv", "jsonl", "zstd"]
std = ["ahiru-zstd?/std"]
# Extra formats are feature-gated, to keep a Parquet-only artifact as small
# as possible (the size budget in DESIGN.md §3).
csv = []
jsonl = []
# Builds ZSTD decompression in by linking `ahiru-zstd` as a library.
# It costs roughly 13 KB (1.3% of the 1 MiB budget), so this replaces the
# older design that always delegated GZIP/ZSTD to the host; built in by
# default now (DESIGN.md §6). Turning it off falls back to the delegation
# path, where the host (JS) loads a separate wasm module as before.
zstd = ["dep:ahiru-zstd"]

# --- Mutating features (opt-out capable) ---------------------------------
# Disabled by default. They are designed to never touch the read-only Source
# model (DESIGN.md §6, §15). Dropping a feature drops the corresponding code
# out of the wasm entirely (scripts/size.sh reports the delta per config).
#
# - export          : COPY (SELECT ...) TO 'x.csv'/'x.jsonl'
# - export-parquet  : same, for Parquet output (heavier: needs the Thrift serializer)
# - ddl             : CREATE TABLE / CREATE TABLE AS / DROP TABLE / CREATE VIEW
#                      (applies only to mutable in-memory tables, a separate
#                      lineage from the read-only Source model; in-memory, non-persistent)
# - dml             : INSERT / UPDATE / DELETE. Only applies to the in-memory
#                      tables `ddl` creates, so it implies `ddl`
#                      (see "DDL/DML design" in DESIGN.md §16).
export = []
export-parquet = ["export"]
ddl = []
dml = ["ddl"]

[dependencies]
# Zero dependencies as a rule. When adding one, attach measured wasm sizes to the PR.
# ahiru-zstd is the sole exception (in-workspace crate, gated by the `zstd`
# feature). Do not enable `standalone` -- that would duplicate the global
# allocator / panic handler / wasm ABI that `ahiru-core` already defines
# (see the comments in both crates' `rt.rs`/`lib.rs`).
ahiru-zstd = { path = "../ahiru-zstd", default-features = false, optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
